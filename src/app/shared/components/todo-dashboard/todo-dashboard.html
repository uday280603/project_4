<div class="container mt-5">
  <div class="card">
    <div class="card-body">
       
      <div class="row">
        <div class="col-md-4">
          <app-todo-form
            (emitNewTodo)="getNewTodo($event)"
            [getEditTodo]="editTodo"
            (emitUpdatedTdod)="getUpdatedObj($event)"
          ></app-todo-form>
        </div>
        <div class="col-md-8">
          <app-todos
            [todoData]="todoArr"
            (emitTodoForUpdate)="getEditTodo($event)"
            (emitReomveId)="getRemoveId($event)"
          ></app-todos>
        </div>
      </div>
    </div>
  </div>
</div>
