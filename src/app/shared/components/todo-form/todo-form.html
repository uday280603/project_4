
<div class="card">
  <div class="card-body">
    <form (submit)="onAddTodo($event)">
      <div class="form-group">
        <label for="todoName">Todo Name*</label>
        <input
          type="text"
          id="todoName"
          [formField]="todoForm.todoName"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="isCompleted">Is Completed*</label>
       <input type="checkbox" [formField]="todoForm.isCompleted" >
      </div>

      @if (!isInEditMode) {
        <button matButton="outlined" class="btn btn-primary w-100">Add Todo</button>
      }@else {
         <button matButton="outlined" class="w-100" type="button" (click)="onUpdateTodo()">Update Todo</button>
      }
    </form>
  </div>
</div>
